<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Delivery App</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
        }

        header {
            background-color: #ff5722;
            color: white;
            padding: 15px;
            text-align: center;
        }

        nav {
            background-color: #e64a19;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
            font-weight: bold;
        }

        .banner {
            background-image: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836');
            background-size: cover;
            background-position: center;
            height: 300px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            font-weight: bold;
        }

        .container {
            padding: 20px;
        }

        .food-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .food-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.2);
        }

        .food-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .food-card h3 {
            margin: 10px;
        }

        .food-card p {
            margin: 10px;
            color: gray;
        }

        .food-card button {
            margin: 10px;
            padding: 10px;
            width: calc(100% - 20px);
            border: none;
            background-color: #ff5722;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        .food-card button:hover {
            background-color: #e64a19;
        }

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 12px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Food Express</h1>
        <p>Delicious Food Delivered Fast</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Menu</a>
        <a href="#">Offers</a>
        <a href="#">Contact</a>
    </nav>

    <div class="banner">
        Order Your Favorite Food
    </div>

    <div class="container">

        <h2>Popular Dishes</h2>

        <div class="food-grid">

            <div class="food-card">
                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd" alt="Burger">
                <h3>Cheese Burger</h3>
                <p>₹199</p>
                <button>Order Now</button>
            </div>

            <div class="food-card">
                <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c" alt="Pizza">
                <h3>Veg Pizza</h3>
                <p>₹299</p>
                <button>Order Now</button>
            </div>

            <div class="food-card">
                <img src="https://images.unsplash.com/photo-1604908176997-431f6fdc8f8d" alt="Biryani">
                <h3>Chicken Biryani</h3>
                <p>₹249</p>
                <button>Order Now</button>
            </div>

        </div>

    </div>

    <footer>
        <p>© 2026 Food Express | All Rights Reserved</p>
    </footer>

</body>
</html>
